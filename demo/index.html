<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bloub-react demo</title>
    <style>
      body { margin: 0; font: 14px system-ui, sans-serif; background: #f9f9f9; color: #222; }
      main { max-width: 900px; margin: 0 auto; padding: 32px 16px; }
      h1 { font-size: 20px; margin: 0 0 4px; }
      p { margin: 0 0 24px; color: #666; }
      .row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin-bottom: 32px; }
      .card { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 96px; }
      .card span { font-size: 11px; color: #666; }
      button { font: inherit; padding: 6px 12px; border: 1px solid #ccc; border-radius: 8px; background: #fff; cursor: pointer; }
      button[data-on="true"] { background: #222; color: #fff; border-color: #222; }
      .chat { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; }
    </style>
  </head>
  <body>
    <main id="root"></main>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
